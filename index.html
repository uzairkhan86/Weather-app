<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #4facfe 0%, #7fd0ff 55%, #d6f1ff 100%);
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Sun */
    .sun {
      position: absolute;
      top: 60px;
      right: 90px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, #fffbd0, #ffd93b);
      box-shadow: 0 0 60px 30px rgba(255, 220, 80, 0.6);
      animation: glow 4s ease-in-out infinite alternate;
    }
    @keyframes glow {
      from { box-shadow: 0 0 50px 20px rgba(255, 220, 80, 0.5); }
      to   { box-shadow: 0 0 80px 40px rgba(255, 220, 80, 0.8); }
    }

    /* Clouds */
    .cloud {
      position: absolute;
      width: 200px;
      height: 60px;
      background: white;
      border-radius: 100px;
      opacity: 0.9;
      animation: drift linear infinite;
    }
    .cloud::before, .cloud::after {
      content: "";
      position: absolute;
      background: white;
      border-radius: 50%;
    }
    .cloud::before { width: 90px; height: 90px; top: -45px; left: 25px; }
    .cloud::after  { width: 65px; height: 65px; top: -30px; left: 100px; }

    .c1 { top: 12%; animation-duration: 60s; }
    .c2 { top: 35%; scale: 0.7; animation-duration: 80s; animation-delay: -30s; }
    .c3 { top: 65%; scale: 1.2; animation-duration: 100s; animation-delay: -60s; }
    .c4 { top: 82%; scale: 0.8; animation-duration: 70s; animation-delay: -10s; }

    @keyframes drift {
      from { transform: translateX(-300px); }
      to   { transform: translateX(calc(100vw + 300px)); }
    }

    /* Card */
    .card {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      padding: 30px;
      border-radius: 20px;
      width: 320px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }
    input {
      padding: 10px;
      width: 62%;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }
    button {
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      background: #0077ff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    #result { margin-top: 25px; }
    .temp { font-size: 52px; font-weight: bold; margin: 5px 0; }
    .icon { font-size: 60px; }
    .details { color: #555; line-height: 1.7; }
  </style>
</head>
<body>
  <div class="sun"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="cloud c4"></div>

  <div class="card">
    <h2>Weather App</h2>
    <input id="city" type="text" placeholder="Enter a city">
    <button onclick="getWeather()">Search</button>
    <div id="result"></div>
  </div>

  <script>
    const cityInput = document.getElementById("city");
    const result = document.getElementById("result");

    // Press Enter to search
    cityInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") getWeather();
    });

    function describe(code) {
      if (code === 0) return ["☀️", "Clear sky"];
      if (code <= 3) return ["⛅", "Partly cloudy"];
      if (code <= 48) return ["🌫️", "Foggy"];
      if (code <= 57) return ["🌦️", "Drizzle"];
      if (code <= 67) return ["🌧️", "Rain"];
      if (code <= 77) return ["❄️", "Snow"];
      if (code <= 82) return ["🌧️", "Rain showers"];
      return ["⛈️", "Thunderstorm"];
    }

    async function getWeather() {
      const city = cityInput.value.trim();
      if (city === "") {
        result.innerHTML = "Please enter a city.";
        return;
      }
      result.innerHTML = "Loading...";

      try {
        // Step 1: turn the city name into coordinates
        const geoUrl = "https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(city) + "&count=1";
        const geoData = await (await fetch(geoUrl)).json();

        if (!geoData.results) {
          result.innerHTML = "City not found.";
          return;
        }
        const place = geoData.results[0];

        // Step 2: get the weather for those coordinates
        const url = "https://api.open-meteo.com/v1/forecast?latitude=" + place.latitude +
          "&longitude=" + place.longitude +
          "&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code";
        const data = await (await fetch(url)).json();
        const now = data.current;
        const [icon, text] = describe(now.weather_code);

        result.innerHTML =
          '<div class="icon">' + icon + '</div>' +
          '<div class="temp">' + Math.round(now.temperature_2m) + '°C</div>' +
          '<h3>' + place.name + ', ' + place.country + '</h3>' +
          '<div class="details">' + text + '<br>Humidity: ' + now.relative_humidity_2m +
          '%<br>Wind: ' + now.wind_speed_10m + ' km/h</div>';
      } catch (error) {
        result.innerHTML = "Something went wrong. Check your internet.";
      }
    }
  </script>
</body>
</html>
